name: Deploy Portfolio to Hostinger Shared Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Assets & Deploy to Hostinger
    runs-on: ubuntu-latest
    environment: prod

    env:
      HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
      HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      HOSTINGER_TARGET_PATH: ${{ secrets.HOSTINGER_TARGET_PATH || '/home/' }}
      HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
      HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
      HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, bcmath, fileinfo, json
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Install NPM Dependencies & Build Tailwind v4 + React Assets
        run: |
          npm ci
          npm run build

      - name: Prepare Clean Staging Deployment Directory
        run: |
          mkdir -p staging/portfolio

          # 1. Package complete portfolio application including compiled public assets
          rsync -a -q --exclude='node_modules' \
                      --exclude='.git' \
                      --exclude='tests' \
                      --exclude='e2e' \
                      --exclude='staging' \
                      --exclude='storage/logs/*.log' \
                      ./ staging/portfolio/

          echo "✓ Staging directory prepared successfully."

      - name: Deploy via SSH and Rsync
        if: env.HOSTINGER_SSH_HOST != ''
        run: |
          mkdir -p ~/.ssh
          if [ -n "$HOSTINGER_SSH_KEY" ]; then
            echo "$HOSTINGER_SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          fi
          ssh-keyscan -p "$HOSTINGER_SSH_PORT" "$HOSTINGER_SSH_HOST" >> ~/.ssh/known_hosts

          # Detect target path based on user root
          TARGET="${HOSTINGER_TARGET_PATH%/}"
          # If TARGET ends with /public_html, strip it to place portfolio beside public_html
          if [[ "$TARGET" == */public_html ]]; then
            TARGET="${TARGET%/public_html}"
          fi

          echo "Target root for deployment: $TARGET"

          # 1. Sync full application to $TARGET/portfolio/
          rsync -avz --delete -e "ssh -p $HOSTINGER_SSH_PORT" staging/portfolio/ "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST:$TARGET/portfolio/"

          # 2. Configure public_html -> portfolio/public symlink and run optimizations
          ssh -p "$HOSTINGER_SSH_PORT" "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" bash -c "'
            TARGET=\"${TARGET}\"
            echo \"Configuring Hostinger symlink on: \$TARGET\"
            cd \"\$TARGET\"

            # Remove existing directory or stale symlink
            if [ -d \"public_html\" ] && [ ! -L \"public_html\" ]; then
              rm -rf public_html
            elif [ -L \"public_html\" ]; then
              rm -f public_html
            fi

            # Connect public_html via Symlink: public_html -> portfolio/public
            ln -s portfolio/public public_html
            ls -ld public_html

            # Navigate to portfolio/ and execute maintenance & cache warmup
            cd \"\$TARGET/portfolio\"
            echo \"Current working directory: \$(pwd)\"

            # Detect PHP 8.3 CLI binary
            PHP_BIN=\"php\"
            for candidate in /opt/alt/php83/usr/bin/php /usr/bin/php8.3 /usr/bin/php83 /usr/local/bin/ea-php83 php; do
              if [ -x \"\$candidate\" ] && \"\$candidate\" -v 2>/dev/null | grep -qE \"8\.[3-9]\"; then
                PHP_BIN=\"\$candidate\"
                break
              fi
            done
            echo \"Using PHP: \$PHP_BIN (\$('\$PHP_BIN' -v | head -n 1))\"

            if [ -f artisan ]; then
              chmod -R 775 storage bootstrap/cache 2>/dev/null || true
              \$PHP_BIN artisan storage:link || true
              \$PHP_BIN artisan migrate --force || true
              \$PHP_BIN artisan view:clear || true
              \$PHP_BIN artisan config:clear || true
              \$PHP_BIN artisan route:clear || true
              \$PHP_BIN artisan config:cache || true
              \$PHP_BIN artisan route:cache || true
              \$PHP_BIN artisan view:cache || true
              echo \"✓ Remote artisan optimizations completed successfully!\"
              if [ -f storage/logs/laravel.log ]; then
                echo \"--- Recent Laravel Log Entries ---\"
                tail -n 25 storage/logs/laravel.log || true
              fi
            fi
          '"

      - name: Deploy via FTPS Fallback
        if: env.HOSTINGER_SSH_HOST == '' && env.HOSTINGER_FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./staging/
          server-dir: ./
